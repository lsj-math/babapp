<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기출 해설 찾기 · 이승준 연구소</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#F6F8F7; --surface:#FFFFFF; --surface-2:#EEF2F1;
    --ink:#141F1D; --muted:#5C6A67; --line:#DCE3E1;
    --accent:#0E6E63; --accent-soft:#DCEFEC;
    --warn:#8F5510; --warn-soft:#F6EBDA;
    --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --f-mono:"IBM Plex Mono","D2Coding",ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ground:#0E1413; --surface:#151C1B; --surface-2:#1C2523;
      --ink:#E7EEEC; --muted:#98A8A5; --line:#27312F;
      --accent:#54CFBE; --accent-soft:#12302C;
      --warn:#D6A461; --warn-soft:#2B2317;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--ground); color:var(--ink);
    font-family:var(--f-body); font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:780px; margin:0 auto; padding:0 16px 80px;}

  /* ── 머리 ─────────────────────────────── */
  header{
    position:sticky; top:0; z-index:20; background:var(--ground);
    padding:16px 0 10px; border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:baseline; gap:9px; margin-bottom:12px;}
  .brand h1{font-size:18px; font-weight:600; margin:0; letter-spacing:-.01em;}
  .brand span{font-family:var(--f-mono); font-size:11px; color:var(--muted);}
  .brand .adm{
    color:var(--warn); background:var(--warn-soft);
    padding:2px 7px; border-radius:3px;
  }
  .ver{margin-left:auto; font-family:var(--f-mono); font-size:10.5px; color:var(--muted);}

  .tabs{display:flex; gap:4px; margin-bottom:10px; flex-wrap:wrap;}
  .tabs button{
    flex:1; min-width:78px; padding:8px 6px; font-family:var(--f-body); font-size:14px;
    background:transparent; color:var(--muted); border:1px solid var(--line);
    border-radius:4px; cursor:pointer;
  }
  .tabs button[aria-selected="true"]{
    background:var(--accent); color:var(--ground); border-color:var(--accent); font-weight:500;
  }

  .controls{display:grid; gap:8px;}
  .row{display:flex; gap:8px;}
  input[type=search], input[type=text], input[type=password], select{
    width:100%; padding:10px 12px; font-family:var(--f-body); font-size:15px;
    background:var(--surface); color:var(--ink);
    border:1px solid var(--line); border-radius:4px;
  }
  input[type=search]{-webkit-appearance:none;}
  input:focus-visible, select:focus-visible, button:focus-visible{
    outline:2px solid var(--accent); outline-offset:1px;
  }
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chips button{
    padding:5px 11px; font-size:13px; font-family:var(--f-body);
    background:var(--surface); color:var(--muted);
    border:1px solid var(--line); border-radius:999px; cursor:pointer;
  }
  .chips button[aria-pressed="true"]{
    background:var(--accent-soft); color:var(--accent);
    border-color:var(--accent); font-weight:500;
  }

  .count{font-family:var(--f-mono); font-size:11.5px; color:var(--muted); padding:9px 2px 0;}
  .rel{
    margin-top:8px; padding:7px 11px; border-radius:4px;
    background:var(--accent-soft); color:var(--accent);
    font-size:12.5px; font-weight:500;
  }
  .rel[hidden]{display:none !important;}

  /* ── 목록 ─────────────────────────────── */
  ul.list{list-style:none; padding:0; margin:6px 0 0; display:grid; gap:7px;}
  li.item{background:var(--surface); border:1px solid var(--line); border-radius:5px; overflow:hidden;}
  .head{
    width:100%; display:grid; grid-template-columns:auto 1fr auto;
    gap:12px; align-items:center; padding:12px 13px;
    background:transparent; border:0; text-align:left; cursor:pointer;
    font-family:var(--f-body); color:var(--ink);
  }
  .head:disabled{cursor:default;}
  .no{
    font-family:var(--f-mono); font-size:19px; font-weight:500;
    min-width:2.4ch; text-align:right; font-variant-numeric:tabular-nums;
  }
  .meta{min-width:0;}
  .src{font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sub{
    font-size:11.5px; color:var(--muted); font-family:var(--f-mono);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;
  }
  .badge{
    font-family:var(--f-mono); font-size:10.5px; letter-spacing:.03em;
    padding:3px 8px; border-radius:3px; white-space:nowrap;
  }
  .b-play{background:var(--accent-soft); color:var(--accent);}
  .b-none{background:var(--surface-2); color:var(--muted);}
  .b-var {background:var(--warn-soft); color:var(--warn);}

  .player{border-top:1px solid var(--line); padding:12px 13px 13px; background:var(--surface-2);}
  .frame{position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:4px; overflow:hidden;}
  .frame iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
  .under{
    display:flex; justify-content:space-between; align-items:center;
    gap:10px; margin-top:9px; font-size:12.5px; color:var(--muted);
  }
  .under a{color:var(--muted);}
  .flag{
    font-family:var(--f-body); font-size:12.5px; padding:5px 10px;
    background:transparent; color:var(--warn);
    border:1px solid var(--line); border-radius:4px; cursor:pointer; white-space:nowrap;
  }
  .flag[disabled]{color:var(--muted); cursor:default;}

  /* ── 공통 조각 ─────────────────────────── */
  h2{font-size:15px; font-weight:600; margin:22px 0 4px;}
  .hint{font-size:13px; color:var(--muted); margin:0 0 12px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:5px; padding:14px; margin-bottom:9px;}
  .card h3{margin:0 0 4px; font-size:15px; font-weight:600;}
  .card p{margin:0; font-size:13px; color:var(--muted);}
  .empty{padding:40px 16px; text-align:center; color:var(--muted); font-size:14.5px;}
  .err{margin:14px 0; padding:13px 15px; border-radius:4px; background:var(--warn-soft); color:var(--warn); font-size:14px;}
  .err b{display:block; margin-bottom:3px;}
  code{
    font-family:var(--f-mono); font-size:12px; background:var(--surface-2);
    border:1px solid var(--line); border-radius:3px; padding:1px 5px;
  }
  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    background:var(--ink); color:var(--ground); padding:10px 16px;
    border-radius:4px; font-size:13.5px; z-index:50; max-width:90vw;
  }
  .toast[hidden]{display:none !important;}

  /* ── 원장 화면 ─────────────────────────── */
  .units{display:flex; flex-wrap:wrap; gap:7px; margin:10px 0 14px;}
  .units label{
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 12px; border:1px solid var(--line); border-radius:999px;
    background:var(--surface); font-size:13.5px; cursor:pointer;
  }
  .units input{accent-color:var(--accent); margin:0;}
  .units label:has(input:checked){
    background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:500;
  }
  /* 교재 한 줄 */
  .brow{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; margin-bottom:6px;
    background:var(--surface); border:1px solid var(--line); border-radius:5px;
  }
  .brow.on{border-color:var(--accent);}
  .bname{flex:1; font-size:14.5px; cursor:pointer; min-width:0;}
  .brow.on .bname{font-weight:600;}
  .bstate{
    font-family:var(--f-mono); font-size:11px; color:var(--accent);
    background:var(--accent-soft); padding:3px 8px; border-radius:3px; white-space:nowrap;
  }
  .bstate.off{color:var(--warn); background:var(--warn-soft);}

  /* 단원 한 줄 (체크 + 순서) */
  .ulist{display:grid; gap:5px; margin:10px 0 4px;}
  .urow{
    display:flex; align-items:center; gap:9px;
    padding:8px 11px; background:var(--surface);
    border:1px solid var(--line); border-radius:5px;
  }
  .urow label{
    flex:1; display:flex; align-items:center; gap:9px;
    font-size:14px; cursor:pointer; min-width:0;
  }
  .urow input{accent-color:var(--accent); margin:0; width:17px; height:17px;}
  .urow:has(input:checked){border-color:var(--accent); background:var(--accent-soft);}
  .ucnt{
    font-family:var(--f-mono); font-size:11px; color:var(--muted); white-space:nowrap;
  }
  .arrow{
    font-family:var(--f-body); font-size:14px; line-height:1;
    width:32px; height:30px; padding:0;
    background:var(--surface); color:var(--ink);
    border:1px solid var(--line); border-radius:4px; cursor:pointer;
  }
  .arrow[disabled]{color:var(--line); cursor:default;}

  .mini.off{background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn);}

  .btn{
    font-family:var(--f-body); font-size:14px; padding:9px 16px;
    background:var(--accent); color:var(--ground); border:0; border-radius:4px; cursor:pointer;
  }
  .btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--line);}
  .btn.warn{background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn);}
  .btns{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .dupv{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:9px 11px; background:var(--surface-2); border-radius:4px; font-size:13px; margin-top:7px;
  }
  .cur{font-family:var(--f-mono); font-size:11px; color:var(--accent);}
  .mini{
    font-family:var(--f-body); font-size:12.5px; padding:5px 11px;
    background:var(--accent); color:var(--ground); border:0; border-radius:4px;
    cursor:pointer; white-space:nowrap;
  }
  .mini[disabled]{background:var(--surface); color:var(--muted); border:1px solid var(--line);}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th,td{text-align:left; padding:8px 9px; border-bottom:1px solid var(--line); vertical-align:top;}
  th{color:var(--muted); font-weight:500; font-size:12px;}
  .scroll{overflow-x:auto;}
  .gate{max-width:460px; margin:70px auto; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:24px;}
  .gate h2{margin:0 0 6px; font-size:17px;}
  .gate p{font-size:13.5px; color:var(--muted); margin:0 0 16px;}
  .gate label{display:block; font-size:12.5px; color:var(--muted); margin:12px 0 4px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ══════════════════════════════════════════════════════════
   기출 해설 찾기 — 한 파일에 학생 화면과 원장 화면이 같이 있습니다.

     그냥 열면            → 학생 화면
     주소 끝에 #admin     → 원장 화면

   아래 두 줄은 공개돼도 되는 값입니다(읽기 전용 키).
   원장 화면은 '로그인'으로 들어갑니다 — 비밀 키는 쓰지 않습니다.
   ══════════════════════════════════════════════════════════ */
const SUPABASE_URL = "https://ydaueqjgeubicpspurxd.supabase.co";
const ANON_KEY     = "sb_publishable_LrtMI0ar9H8tbbUK4u2Iqw_gHvgDRLM";
const VERSION      = "v9";
/* ════════════════════════════════════════════════════════ */

/* 학원 관리앱을 거쳐 들어와야 열린다.
   관리앱이 개인 링크의 토큰(?t=)을 그대로 넘겨주고, 여기서 재원생인지 확인한다.
   퇴원해서 관리앱이 그 토큰을 지우면 이 화면도 같이 막힌다.
   혼자 시험해볼 때만 잠깐 false 로. */
const REQUIRE_TOKEN = true;

const IS_ADMIN   = location.hash.toLowerCase().startsWith("#admin");
const SESS_STORE = "arc_admin_session";
const BASE       = SUPABASE_URL.replace(/\/+$/, "");

/* 로그인 상태 — 이 브라우저에만 남습니다. 비밀번호는 저장하지 않습니다. */
let sess = null;
if (IS_ADMIN) { try { sess = JSON.parse(localStorage.getItem(SESS_STORE) || "null"); } catch (e) { sess = null; } }

function saveSess(j){
  sess = { access_token:j.access_token, refresh_token:j.refresh_token,
           email:(j.user && j.user.email) || (sess && sess.email) || "",
           exp: Date.now() + ((j.expires_in || 3600) * 1000) - 60000 };
  localStorage.setItem(SESS_STORE, JSON.stringify(sess));
}
function dropSess(){ sess = null; localStorage.removeItem(SESS_STORE); }

async function login(email, password){
  const r = await fetch(BASE + "/auth/v1/token?grant_type=password", {
    method:"POST", headers:{ apikey:ANON_KEY, "Content-Type":"application/json" },
    body: JSON.stringify({ email, password }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.msg || j.message || "로그인 실패");
  saveSess(j);
}
async function refreshSess(){
  if (!sess || !sess.refresh_token) return false;
  const r = await fetch(BASE + "/auth/v1/token?grant_type=refresh_token", {
    method:"POST", headers:{ apikey:ANON_KEY, "Content-Type":"application/json" },
    body: JSON.stringify({ refresh_token: sess.refresh_token }) });
  if (!r.ok) { dropSess(); return false; }
  saveSess(await r.json());
  return true;
}

const el   = id => document.getElementById(id);
const esc  = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const toast = msg => {
  const t = el("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(t._t); t._t = setTimeout(() => t.hidden = true, 2600);
};

/* apikey 는 늘 공개 키. 원장 화면일 때만 로그인 토큰을 얹는다. */
async function api(path, opt = {}, retry = true){
  if (IS_ADMIN && sess && Date.now() > sess.exp) await refreshSess();

  const { method="GET", params, body, prefer } = opt;
  const u = new URL(BASE + "/rest/v1/" + path);
  Object.entries(params || {}).forEach(([k, v]) => u.searchParams.set(k, v));

  const token = (IS_ADMIN && sess) ? sess.access_token : ANON_KEY;
  const h = { apikey:ANON_KEY, Authorization:"Bearer " + token };
  if (body)   h["Content-Type"] = "application/json";
  if (prefer) h["Prefer"] = prefer;

  const r = await fetch(u, { method, headers:h, body: body ? JSON.stringify(body) : undefined });

  if (r.status === 401 && IS_ADMIN && retry && await refreshSess())
    return api(path, opt, false);

  if (!r.ok) {
    const t = await r.text();
    if (r.status === 401) throw new Error("__LOGIN__");
    if (r.status === 403 || /row-level security/i.test(t))
      throw new Error("이 계정은 원장으로 등록돼 있지 않습니다.\n" +
                      "SQL Editor에서 arc_admins 에 로그인 이메일을 넣어주세요.");
    throw new Error(t.slice(0, 300));
  }
  const t = await r.text();
  return t ? JSON.parse(t) : [];
}

/* 공용 상태 */
let books = [], book = null, rows = [], release = null;

function fileWarning(){
  if (location.protocol !== "file:") return "";
  return `<div class="err"><b>주소창이 file:// 입니다</b>` +
    `이렇게 열면 유튜브 재생이 막힙니다(오류 153). 아래 중 하나로 여세요.<br>` +
    `· 이 폴더에서 <code>python -m http.server 8000</code> 실행 후 ` +
    `<code>http://localhost:8000/arc.html</code><br>` +
    `· 또는 Netlify · GitHub Pages 에 올려서 사용</div>`;
}

async function loadBooks(){
  books = await api("arc_books", { params:{
    select:"id,name,grade,edition,is_current", order:"is_current.desc,edition.desc" } });
}

async function loadRows(id){
  return api("arc_lookup", { params:{
    book_id:"eq." + id, limit:"2000",
    order:"unit.asc,section.asc,no_in_unit.asc",
    select:"item_label,unit,no_in_unit,section,page,code,exam_label,youtube_id,status,source_raw,origin,origin_kind" } });
}

/* 교재별 공개 설정을 한 번에 읽어 둔다 */
let relMap = {};
async function loadReleases(){
  relMap = {};
  try {
    const r = await api("arc_release", { params:{
      select:"book_id,label,units,is_open,unit_order", limit:"200" } });
    r.forEach(x => relMap[Number(x.book_id)] = x);
  } catch (e) { /* 04·06 마이그레이션 전이면 그냥 전체 공개로 본다 */ }
}
const relOf = id => relMap[Number(id)] || null;

/* 정해둔 순서대로. 순서에 없는 단원은 뒤에 이름순으로 */
function orderUnits(list, ord){
  const ix = new Map((ord || []).map((u, i) => [u, i]));
  return list.slice().sort((a, b) =>
    (ix.has(a) ? ix.get(a) : 9e3) - (ix.has(b) ? ix.get(b) : 9e3) ||
    a.localeCompare(b, "ko"));
}
function sortRowsByUnit(list, order){
  const ix = new Map(order.map((u, i) => [u, i]));
  return list.slice().sort((a, b) =>
    (ix.has(a.unit) ? ix.get(a.unit) : 9e3) - (ix.has(b.unit) ? ix.get(b.unit) : 9e3) ||
    String(a.section || "").localeCompare(String(b.section || ""), "ko") ||
    (a.no_in_unit ?? 0) - (b.no_in_unit ?? 0));
}


/* ══════════════════════════════════════════════════════════
   학생 화면
   ══════════════════════════════════════════════════════════ */
/* 재생 가능만 — 처음부터 켜둔다. 영상 없는 문항을 눌러보는 헛손질을 막는다. */
let unit = "", okind = "", filters = { play:true, chal:false }, openLabel = null;
const flagged = new Set();

function sShell(){
  el("app").innerHTML = `
    ${fileWarning()}
    <header>
      <div class="brand">
        <h1>기출 해설 찾기</h1>
        <span>이승준 연구소</span>
        <span class="ver">${VERSION}</span>
      </div>
      <div class="controls" id="controls">
        <div class="row"><select id="book" onchange="sLoadBook()" aria-label="교재"></select></div>
        <div class="row">
          <input type="search" id="q" placeholder="번호 · 단원 · 유형 · 출처로 찾기"
                 oninput="sRender()" aria-label="검색">
        </div>
        <div class="chips" id="units"></div>
        <div class="chips" id="okinds"></div>
        <div class="chips">
          <button id="f-play" aria-pressed="${filters.play}" onclick="sToggleFilter('play')">재생 가능만</button>
          <button id="f-chal" aria-pressed="${filters.chal}" onclick="sToggleFilter('chal')">1등급 도전만</button>
        </div>
      </div>
      <div class="count" id="count"></div>
      <div class="rel" id="rel" hidden></div>
    </header>
    <div id="body"></div>`;
}

function sFail(title, detail){
  el("body").innerHTML = `<div class="err"><b>${esc(title)}</b>${esc(detail).slice(0, 400)}</div>`;
}

/* 관리앱이 넘겨준 토큰이 지금도 살아 있는 토큰인지 본다 */
async function tokenOk(){
  if (!REQUIRE_TOKEN) return true;
  const t = new URLSearchParams(location.search).get("t");
  if (!t) return false;
  try {
    const r = await api("app_config", { params:{ key:"eq.accessTokens", select:"value" } });
    const map = (r[0] && r[0].value) || {};
    for (const id in map) {
      const x = map[id] || {};
      if (x.s === t || x.p === t) return true;
    }
  } catch (e) { /* 못 읽으면 막는 쪽으로 */ }
  return false;
}

function sGate(){
  el("app").innerHTML = `
    ${fileWarning()}
    <div class="gate">
      <h2>학원 앱에서 열어주세요</h2>
      <p>이 화면은 학원 관리앱을 통해서만 볼 수 있습니다.<br><br>
         문자로 받으신 <b>개인 주소</b>로 들어가서
         「기출 해설 영상」을 눌러주세요.</p>
      <p style="margin-top:16px">링크를 잃어버렸으면 선생님께 말씀해 주세요.</p>
    </div>`;
}

async function sStart(){
  if (!(await tokenOk())) return sGate();
  sShell();
  try { await loadBooks(); await loadReleases(); }
  catch (e) { return sFail("교재 목록을 못 불러왔습니다", e.message); }
  if (!books.length) return sFail("교재가 없습니다", "먼저 교재를 적재하세요.");

  // 원장이 닫아둔 교재는 목록에 아예 안 나온다
  const shown = books.filter(b => {
    const r = relOf(b.id);
    return !(r && r.is_open === false);
  });
  if (!shown.length) {
    el("controls").hidden = true; el("count").textContent = "";
    el("body").innerHTML = `<div class="empty">지금은 열려 있는 교재가 없습니다.</div>`;
    return;
  }
  el("book").innerHTML = shown
    .map(b => `<option value="${b.id}">${esc(b.name)} ${esc(b.edition || "")}</option>`).join("");
  el("book").parentElement.hidden = (shown.length < 2);   // 한 권이면 고를 것도 없다
  sLoadBook();
}

async function sLoadBook(){
  const id = el("book").value;
  el("body").innerHTML = `<div class="empty">불러오는 중…</div>`;

  release = relOf(id);
  try { rows = await loadRows(id); }
  catch (e) { return sFail("문항을 못 불러왔습니다", e.message); }

  const open = (release && release.units && release.units.length) ? release.units : null;
  if (open) rows = rows.filter(r => open.includes(r.unit));

  el("controls").hidden = false;
  const us = orderUnits([...new Set(rows.map(r => r.unit).filter(Boolean))],
                        release && release.unit_order);
  rows = sortRowsByUnit(rows, us);
  el("units").innerHTML =
    `<button aria-pressed="true" onclick="sSetUnit('')">전체</button>` +
    us.map(u => `<button aria-pressed="false" onclick="sSetUnit('${esc(u)}')">${esc(u)}</button>`).join("");

  const relEl = el("rel");
  if (release && (release.label || open)) {
    relEl.hidden = false;
    relEl.textContent = (release.label || "공개 범위") + (open ? ` · ${open.length}개 단원` : "");
  } else relEl.hidden = true;

  // 출처 갈래 — 이 교재에 실제로 있는 것만 (모의고사 · 고국고 기출 · …)
  const ORDER = ["모의고사", "학교기출", "변형", "교재", "기타", "없음"];
  const kinds = [...new Set(rows.map(r => r.origin_kind).filter(Boolean))]
    .sort((a, b) => ORDER.indexOf(a) - ORDER.indexOf(b));
  const mine = [...new Set(rows.filter(r => r.origin_kind === "학교기출")
                               .map(r => (r.origin || "").replace(/^\d+년\s*/, "").replace(/\s*기출$/, ""))
                               .filter(Boolean))];
  const top = mine.length ? mine.reduce((a, b) =>
    rows.filter(r => (r.origin || "").includes(a)).length >=
    rows.filter(r => (r.origin || "").includes(b)).length ? a : b) : null;

  el("okinds").innerHTML = (kinds.length > 1)
    ? `<button aria-pressed="true" onclick="sSetKind('')">출처 전체</button>` +
      kinds.map(k => `<button aria-pressed="false" onclick="sSetKind('${esc(k)}')">${esc(k)}</button>`).join("") +
      (top ? `<button aria-pressed="false" onclick="sSetKind('@${esc(top)}')">${esc(top)}만</button>` : "")
    : "";

  unit = ""; okind = ""; openLabel = null;
  sRender();
}

function sSetUnit(u){
  unit = u;
  [...el("units").children].forEach(b =>
    b.setAttribute("aria-pressed", String(b.textContent === (u || "전체"))));
  sRender();
}
function sSetKind(k){
  okind = k;
  const label = k ? (k[0] === "@" ? k.slice(1) + "만" : k) : "출처 전체";
  [...el("okinds").children].forEach(b =>
    b.setAttribute("aria-pressed", String(b.textContent.trim() === label)));
  sRender();
}
function sToggleFilter(k){
  filters[k] = !filters[k];
  el(k === "play" ? "f-play" : "f-chal").setAttribute("aria-pressed", String(filters[k]));
  sRender();
}
function sToggle(label){
  openLabel = (openLabel === label) ? null : label;
  sRender();
}

function sMatched(){
  const q = el("q").value.trim();
  const num = /^\d+$/.test(q) ? Number(q) : null;
  const kw = q.toLowerCase();
  return rows.filter(r => {
    if (unit && r.unit !== unit) return false;
    if (okind) {
      if (okind[0] === "@") { if (!String(r.origin || "").includes(okind.slice(1))) return false; }
      else if (r.origin_kind !== okind) return false;
    }
    if (filters.play && r.status !== "재생가능") return false;
    if (filters.chal && r.section !== "1등급도전") return false;
    if (!q) return true;
    if (num !== null) return r.no_in_unit === num || r.page === num;
    return [r.unit, r.section, r.exam_label, r.origin, r.source_raw, r.code, r.item_label, r.qtype]
      .some(v => String(v ?? "").toLowerCase().includes(kw));
  });
}

function badge(r){
  if (r.status === "재생가능") return `<span class="badge b-play">재생</span>`;
  return `<span class="badge b-none">준비중</span>`;
}
/* 화면에 보일 출처 한 줄 */
function srcLine(r){
  return r.origin || r.exam_label || r.source_raw || "출처 없음";
}

function sCard(r){
  const open = openLabel === r.item_label;
  const can  = !!r.youtube_id;
  const sub  = [r.unit, r.qtype, r.section === "1등급도전" ? "1등급 도전" : null,
                r.page ? r.page + "쪽" : null].filter(Boolean).join(" · ");
  return `
  <li class="item">
    <button class="head" ${can ? "" : "disabled"} onclick="sToggle('${esc(r.item_label)}')">
      <span class="no">${r.no_in_unit ?? "–"}</span>
      <span class="meta">
        <span class="src">${esc(srcLine(r))}${
          r.code ? ` <span class="sub" style="display:inline">${esc(r.code.split("-").pop().replace(/^0+/,""))}번</span>` : ""}</span>
        <span class="sub">${esc(sub)}</span>
      </span>
      ${badge(r)}
    </button>
    ${open && can ? `
    <div class="player">
      <div class="frame">
        <iframe src="https://www.youtube-nocookie.com/embed/${esc(r.youtube_id)}?rel=0"
                title="${esc(r.exam_label || "")} 해설" allowfullscreen
                allow="accelerometer; encrypted-media; picture-in-picture"></iframe>
      </div>
      <div class="under">
        <span>${esc(r.source_raw || r.origin || r.code || "")}
          · <a href="https://youtu.be/${esc(r.youtube_id)}" target="_blank" rel="noopener">유튜브에서 보기</a>
        </span>
        <button class="flag" ${flagged.has(r.item_label) ? "disabled" : ""}
                onclick="sFlag('${esc(r.item_label)}','${esc(r.code || "")}','${esc(r.youtube_id)}')">
          ${flagged.has(r.item_label) ? "신고함" : "이 연결 이상해요"}
        </button>
      </div>
    </div>` : ""}
  </li>`;
}

function sRender(){
  const list = sMatched();
  const playable = rows.filter(r => r.status === "재생가능").length;
  el("count").textContent =
    `${list.length}문항 표시 · 이 교재 ${rows.length}문항 중 ${playable}개 재생 가능`;
  el("body").innerHTML = list.length
    ? `<ul class="list">${list.map(sCard).join("")}</ul>`
    : `<div class="empty">${filters.play
        ? "여기에는 아직 영상이 없습니다.<br><span style=\"font-size:13px\">「재생 가능만」을 끄면 전체 문항이 보입니다.</span>"
        : "찾는 문항이 없습니다."}</div>`;
}

async function sFlag(label, code, vid){
  const memo = prompt("무엇이 이상한가요? (비워두셔도 됩니다)") ?? "";
  try {
    await api("arc_flags", { method:"POST", prefer:"return=minimal",
      body:{ book_id:Number(el("book").value), item_label:label,
             problem_code:code || null, youtube_id:vid || null,
             kind:"연결틀림", memo:memo || null } });
    flagged.add(label);
    toast("신고했습니다. 확인 후 고치겠습니다.");
    sRender();
  } catch (e) { toast("신고를 보내지 못했습니다"); console.error(e); }
}


/* ══════════════════════════════════════════════════════════
   원장 화면  (#admin)
   ══════════════════════════════════════════════════════════ */
let aTab = "release", rel = null;

function aGate(msg){
  el("app").innerHTML = `
    <div class="gate">
      <h2>원장 화면</h2>
      <p>Supabase에 등록된 계정으로 들어갑니다.<br>
         비밀번호는 저장되지 않습니다.</p>
      ${msg ? `<div class="err">${esc(msg)}</div>` : ""}
      <label>이메일</label>
      <input type="text" id="g-mail" autocomplete="username"
             value="${esc((sess && sess.email) || "")}"
             onkeydown="if(event.key==='Enter')el('g-pw').focus()">
      <label>비밀번호</label>
      <input type="password" id="g-pw" autocomplete="current-password"
             onkeydown="if(event.key==='Enter')aLogin()">
      <div class="btns" style="margin-top:16px">
        <button class="btn" id="g-btn" onclick="aLogin()">들어가기</button>
      </div>
    </div>`;
  setTimeout(() => el((sess && sess.email) ? "g-pw" : "g-mail")?.focus(), 60);
}

async function aLogin(){
  const mail = el("g-mail").value.trim();
  const pw   = el("g-pw").value;
  if (!mail || !pw) return toast("둘 다 채워주세요");
  const btn = el("g-btn"); btn.disabled = true; btn.textContent = "확인 중…";
  try {
    await login(mail, pw);
    aStart();
  } catch (e) {
    aGate(/Invalid login/i.test(e.message)
      ? "이메일이나 비밀번호가 맞지 않습니다."
      : e.message);
  }
}

function aForget(){
  fetch(BASE + "/auth/v1/logout", { method:"POST",
    headers:{ apikey:ANON_KEY, Authorization:"Bearer " + (sess ? sess.access_token : ANON_KEY) } })
    .catch(() => {});
  dropSess();
  aGate("나왔습니다.");
}

function aShell(inner){
  el("app").innerHTML = `
    ${fileWarning()}
    <header>
      <div class="brand">
        <h1>문항 아카이브</h1>
        <span class="adm">원장 전용</span>
        <span class="ver">${VERSION}</span>
      </div>
      <div class="tabs">
        ${[["release","공개 범위"],["dupe","겹침 검토"],["flag","신고함"],["todo","촬영 대기"]]
          .map(([k,n]) => `<button aria-selected="${aTab===k}" onclick="aSetTab('${k}')">${n}</button>`).join("")}
      </div>
      <select id="book" onchange="aPickBook()">
        ${books.map(b => `<option value="${b.id}" ${b.id===book?"selected":""}>${esc(b.name)} ${esc(b.edition||"")}</option>`).join("")}
      </select>
    </header>
    <div id="main">${inner}</div>
    <div class="btns" style="margin-top:36px">
      <button class="btn ghost" onclick="location.hash=''; location.reload()">학생 화면으로 보기</button>
      <button class="btn ghost" onclick="aForget()">로그아웃</button>
      ${sess && sess.email ? `<span class="hint" style="margin:0">${esc(sess.email)}</span>` : ""}
    </div>`;
}

async function aStart(){
  if (!sess) return aGate();
  try { await loadBooks(); await loadReleases(); }
  catch (e) {
    if (e.message === "__LOGIN__") { dropSess(); return aGate("다시 로그인해주세요."); }
    return aGate(e.message);
  }
  if (!books.length) return aShell(`<div class="empty">교재가 없습니다.</div>`);
  book = book || books[0].id;
  await aPickBook();
}

async function aPickBook(){
  book = Number(el("book") ? el("book").value : book);
  aShell(`<div class="empty">불러오는 중…</div>`);
  try { rows = await loadRows(book); }
  catch (e) {
    return aShell(`<div class="err"><b>불러오지 못했습니다</b>${esc(e.message)}</div>`);
  }
  rel = relOf(book) || { book_id:book, label:"", units:[], is_open:true, unit_order:[] };
  workOrder = orderUnits([...new Set(rows.map(r => r.unit).filter(Boolean))], rel.unit_order);
  aSetTab(aTab);
}

function aSetTab(t){
  aTab = t;
  ({ release:aViewRelease, dupe:aViewDupe, flag:aViewFlag, todo:aViewTodo })[t]();
}

/* ── 공개 범위 ─────────────────────────── */
let workOrder = [];           // 지금 편집 중인 단원 순서
const checkedNow = () =>
  new Set([...document.querySelectorAll(".ulist input:checked")].map(c => c.value));

function bookState(b){
  const r = relOf(b.id);
  if (r && r.is_open === false) return { txt:"닫힘", open:false };
  if (r && r.units && r.units.length) return { txt:`${r.units.length}개 단원`, open:true };
  return { txt:"전체 공개", open:true };
}

function aViewRelease(){
  const on = new Set(rel.units || []);
  const playable = u => rows.filter(r => r.unit === u && r.status === "재생가능").length;
  const total    = u => rows.filter(r => r.unit === u).length;

  aShell(`
    <h2>학생에게 보일 교재</h2>
    <p class="hint">닫은 교재는 학생 화면의 교재 목록에서 아예 사라집니다.</p>
    ${books.map(b => {
      const st = bookState(b);
      return `
      <div class="brow ${b.id === book ? "on" : ""}">
        <span class="bname" onclick="aJump(${b.id})">${esc(b.name)} ${esc(b.edition || "")}</span>
        <span class="bstate ${st.open ? "" : "off"}">${st.txt}</span>
        <button class="mini ${st.open ? "off" : ""}" onclick="aToggleBook(${b.id}, ${!st.open})">
          ${st.open ? "닫기" : "열기"}
        </button>
      </div>`;
    }).join("")}

    <h2 style="margin-top:26px">단원 — 열어줄 것과 순서</h2>
    <p class="hint">
      체크한 단원만 학생 화면에 보입니다. 하나도 체크 안 하면 전체가 열립니다.<br>
      ↑ ↓ 로 순서를 바꾸면 학생 화면도 그 순서로 나옵니다.
      오른쪽 숫자는 <b>재생 가능 / 전체</b> 문항 수입니다.
    </p>
    <div class="ulist">
      ${workOrder.map((u, i) => `
        <div class="urow">
          <label><input type="checkbox" value="${esc(u)}" ${on.has(u) ? "checked" : ""}>
            <span>${esc(u)}</span></label>
          <span class="ucnt">${playable(u)} / ${total(u)}</span>
          <button class="arrow" ${i === 0 ? "disabled" : ""} onclick="aMove(${i},-1)" title="위로">↑</button>
          <button class="arrow" ${i === workOrder.length - 1 ? "disabled" : ""} onclick="aMove(${i},1)" title="아래로">↓</button>
        </div>`).join("")}
    </div>
    <div class="btns" style="margin-top:10px">
      <button class="btn ghost" onclick="aCheckAll(true)">전부 체크</button>
      <button class="btn ghost" onclick="aCheckAll(false)">전부 해제</button>
    </div>

    <h2>학생 화면에 뜰 이름</h2>
    <p class="hint">예: 2학기 기말 대비</p>
    <input type="text" id="rel-label" value="${esc(rel.label || "")}" placeholder="비워두면 안 뜹니다">

    <div class="btns" style="margin-top:18px">
      <button class="btn" onclick="aSaveRelease(true)">저장하고 열기</button>
      <button class="btn warn" onclick="aSaveRelease(false)">이 교재 닫기</button>
    </div>
    <p class="hint" style="margin-top:12px">
      지금 저장된 상태 — ${rel.is_open === false ? "<b>닫힘</b>"
        : (rel.units && rel.units.length ? `${rel.units.length}개 단원 공개` : "전체 공개")}
    </p>`);
}

/* 순서 바꾸기 — 체크 상태와 이름은 화면에서 그대로 물려받는다 */
function aMove(i, d){
  const j = i + d;
  if (j < 0 || j >= workOrder.length) return;
  const on = checkedNow();
  const label = el("rel-label")?.value || "";
  [workOrder[i], workOrder[j]] = [workOrder[j], workOrder[i]];
  rel = { ...rel, units:[...on], label };
  aViewRelease();
}
function aCheckAll(v){
  const label = el("rel-label")?.value || "";
  rel = { ...rel, units: v ? workOrder.slice() : [], label };
  aViewRelease();
}

async function aJump(id){
  if (id === book) return;
  el("book").value = id;
  await aPickBook();
}

/* 교재 자체를 열고 닫기 */
async function aToggleBook(id, open){
  const r = relOf(id) || { book_id:id, label:null, units:[], unit_order:[] };
  try {
    await api("arc_release", {
      method:"POST", params:{ on_conflict:"book_id" },
      prefer:"resolution=merge-duplicates,return=minimal",
      body:{ book_id:id, units:r.units || [], unit_order:r.unit_order || [],
             label:r.label || null, is_open:open, updated_at:new Date().toISOString() } });
    await loadReleases();
    if (id === book) rel = relOf(book) || rel;
    toast(open ? "학생 화면에 보입니다" : "학생 화면에서 감췄습니다");
    aViewRelease();
  } catch (e) { toast("바꾸지 못했습니다 — " + e.message); }
}

async function aSaveRelease(open){
  const units = workOrder.filter(u => checkedNow().has(u));   // 순서대로 담는다
  const label = (el("rel-label")?.value || "").trim();
  try {
    await api("arc_release", {
      method:"POST", params:{ on_conflict:"book_id" },
      prefer:"resolution=merge-duplicates,return=minimal",
      body:{ book_id:book, units, unit_order:workOrder, label: label || null,
             is_open:open, updated_at:new Date().toISOString() } });
    await loadReleases();
    rel = relOf(book) || { book_id:book, units, label, is_open:open, unit_order:workOrder };
    toast(open ? (units.length ? `${units.length}개 단원을 열었습니다` : "전체를 열었습니다")
               : "이 교재를 닫았습니다");
    aViewRelease();
  } catch (e) { toast("저장 실패 — " + e.message); }
}

/* ── 겹침 검토 ─────────────────────────── */
async function aViewDupe(){
  aShell(`<div class="empty">불러오는 중…</div>`);
  let d = [];
  try { d = await api("arc_dupes", { params:{ limit:"500", select:"group_key,problem_code,exam_label,videos" } }); }

    <p class="hint">두 영상을 열어보고 학생에게 보여줄 것을 고르세요. 고르지 않은 영상도 지워지지 않고 그대로 남습니다.</p>
    ${d.map(x => `
      <div class="card">
        <h3>${esc(x.exam_label || x.problem_code || x.group_key)}</h3>
        <p>${esc(x.problem_code || "이 교재 전용")}</p>
        ${(x.videos || []).map(v => `
          <div class="dupv">
            <span>
              <a href="https://youtu.be/${esc(v.youtube_id)}" target="_blank" rel="noopener">${esc(v.youtube_id)}</a>
              ${v.recorded_on ? " · " + esc(v.recorded_on) : ""}${v.note ? " · " + esc(v.note) : ""}
              ${v.is_primary ? ' <span class="cur">학생에게 보이는 것</span>' : ""}
            </span>
            <button class="mini" ${v.is_primary ? "disabled" : ""}
              onclick="aSetPrimary('${esc(x.group_key).replace(/'/g,"\\'")}','${esc(v.youtube_id)}')">
              ${v.is_primary ? "선택됨" : "이걸로"}
            </button>
          </div>`).join("")}
      </div>`).join("")}`);
}

/* 내리고 올리는 것을 DB 함수 하나로 한다.
   두 번에 나눠 보내면 앞의 것이 안 먹혔을 때 기본 재생본이 둘이 되어 막힌다. */
async function aSetPrimary(key, vid){
  try {
    await api("rpc/set_primary_video", {
      method:"POST", prefer:"return=minimal", body:{ p_youtube_id: vid } });
    toast("바꿨습니다");
    aViewDupe();
  } catch (e) {
    toast(/23505|primary_uniq/.test(e.message)
      ? "바꾸지 못했습니다 — 기존 대표를 못 내렸습니다. 새로고침 후 다시 해보세요."
      : "실패 — " + e.message);
  }
}

/* ── 신고함 ───────────────────────────── */
async function aViewFlag(){
  aShell(`<div class="empty">불러오는 중…</div>`);
  let f = [];
  try {
    f = await api("arc_flags_open", { params:{ limit:"200",
      select:"created_at,book_name,item_label,kind,problem_code,youtube_id,memo,unit,no_in_unit,section,source_raw,page" } });
  } catch (e) { return aShell(`<div class="err"><b>불러오지 못했습니다</b>${esc(e.message)}</div>`); }

  aShell(!f.length ? `<div class="empty">들어온 신고가 없습니다.</div>` : `
    <h2>신고 ${f.length}건</h2>
    <p class="hint">학생이 「이 연결 이상해요」를 누른 자리입니다. 교재와 대조해보고 고치세요.</p>
    <div class="scroll"><table>
      <tr><th>언제</th><th>어디</th><th>지금 붙은 출처</th><th>영상</th><th>메모</th></tr>
      ${f.map(x => `<tr>
        <td>${esc((x.created_at || "").slice(5, 16).replace("T", " "))}</td>
        <td>${esc(x.unit || "")} ${x.section === "1등급도전" ? "도전" : ""}${esc(x.no_in_unit ?? "")}번<br>
            <span style="color:var(--muted);font-size:11.5px">${esc(x.page ? x.page + "쪽" : "")}</span></td>
        <td>${esc(x.source_raw || x.problem_code || "")}</td>
        <td>${x.youtube_id ? `<a href="https://youtu.be/${esc(x.youtube_id)}" target="_blank" rel="noopener">열기</a>` : ""}</td>
        <td>${esc(x.memo || "")}</td>
      </tr>`).join("")}
    </table></div>`);
}

/* ── 촬영 대기 ─────────────────────────── */
function aViewTodo(){
  const list = rows.filter(r => r.status === "영상없음");
  const by = {};
  list.forEach(r => (by[r.unit] = by[r.unit] || []).push(r));
  aShell(`
    <h2>아직 영상이 없는 문항 ${list.length}개</h2>
    <p class="hint">이 교재 ${rows.length}문항 중 ${rows.filter(r => r.status === "재생가능").length}개가 재생 가능합니다.</p>
    ${Object.entries(by).map(([u, rs]) => `
      <div class="card">
        <h3>${esc(u)} <span style="color:var(--muted);font-weight:400">${rs.length}개</span></h3>
        <p>${rs.map(r => (r.section === "1등급도전" ? "도전" : "") + (r.no_in_unit ?? "?")).join(", ")}</p>
      </div>`).join("") || `<div class="empty">전부 영상이 있습니다.</div>`}`);
}


/* ── 시작 ─────────────────────────────── */
window.addEventListener("hashchange", () => location.reload());
(IS_ADMIN ? aStart : sStart)();
</script>
